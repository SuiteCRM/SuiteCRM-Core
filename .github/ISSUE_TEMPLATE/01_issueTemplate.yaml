name: Report a Bug or Missing Feature
description: Tell us about a bug in SuiteCRM 8, or a SuiteCRM 7 feature that is missing from SuiteCRM 8.
labels: ["Type:Bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please search the existing issues first, and check the problem still happens in the latest release of SuiteCRM 8.

        - Security risk? Please read our [Security Policy](https://docs.suitecrm.com/community/security-policy) instead.
        - SuiteCRM 7 issue? [Raise it here](https://github.com/SuiteCRM/SuiteCRM/issues/new/choose).
        - Want to build a feature? Use the Propose a Feature form.
        - Want to suggest a feature? Use the [Suggestion Box](https://community.suitecrm.com/c/suggestion-box/13).

  - type: textarea
    id: issue
    attributes:
      label: Issue
      description: Describe the bug and what you expected to happen, or the SuiteCRM 7 feature you are missing and how it works there.
      placeholder: Ensure that all code ``` is surrounded ``` by triple back quotes. This can also be done over multiple lines.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: For a bug, give a link to a live example or the steps to reproduce it, including code if relevant.
      value: |
        1.
        2.
        3.
      render: bash
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version
      description: What version of SuiteCRM are you running?
      placeholder: ex. 8.10.2
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser and version, PHP and database versions, and operating system, if relevant.
      placeholder: ex. Chrome 122, PHP 8.2, MySQL 8, Ubuntu 23.10
    validations:
      required: false
  - type: checkboxes
    id: voting
    attributes:
      label: Voting
      options:
        - label: Voting helps us decide what to work on. If this affects you too, add a 👍 reaction to this post. [How voting works](https://docs.suitecrm.com/community/raising-issues/issues-voting/)
          required: true
