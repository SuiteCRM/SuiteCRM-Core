<div class="modal-header">
    <h4 class="modal-title">{{ label('LBL_SAMPLE') }}</h4>
    <button type="button" class="btn-close close" [attr.aria-label]="label('LBL_CANCEL_BUTTON_LABEL')"
            (click)="modal.dismiss()"><span aria-hidden="true">&times;</span></button>
</div>
<div class="modal-body">
    <label class="sr-only visually-hidden" for="pdf-template-sample">{{ label('LBL_SAMPLE') }}</label>
    <select id="pdf-template-sample" class="form-control form-control-sm" [(ngModel)]="selected">
        <option *ngFor="let sample of samples; let index = index" [ngValue]="index">{{ sample.label }}</option>
    </select>
    <p *ngIf="overwrite" class="text-danger mt-3 mb-0" role="alert">{{ label('LBL_WARNING_OVERWRITE') }}</p>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-sm btn-secondary" (click)="modal.dismiss()">{{ label('LBL_CANCEL_BUTTON_LABEL') }}</button>
    <button type="button" class="btn btn-sm btn-main" [disabled]="selected === null"
            (click)="modal.close(samples[selected])">{{ label('LBL_BUTTON_INSERT') }}</button>
</div>
