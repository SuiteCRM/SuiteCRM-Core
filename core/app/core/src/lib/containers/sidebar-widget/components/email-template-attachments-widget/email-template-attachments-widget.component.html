<section class="email-template-attachments">
    <h3 class="email-template-attachments-title">{{ label('LBL_ATTACHMENTS') }}</h3>
    <p *ngIf="error" class="email-template-attachments-error" role="alert">{{ label('LBL_TEMPLATE_ATTACHMENTS_ERROR') }}</p>
    <ul *ngIf="attachments.length; else empty" class="email-template-attachments-list" [class.is-loading]="loading">
        <li *ngFor="let attachment of attachments">
            <a [href]="link(attachment)" target="_blank" rel="noopener">{{ attachment.name }}</a>
            <span class="email-template-attachments-size">{{ size(attachment.size) }}</span>
            <button *ngIf="editable" type="button" class="btn btn-sm btn-link" [disabled]="loading"
                    (click)="remove(attachment)">{{ label('LBL_TEMPLATE_ATTACHMENTS_REMOVE') }}</button>
        </li>
    </ul>
    <ng-template #empty>
        <p *ngIf="!loading && !error" class="email-template-attachments-muted">{{ label('LBL_TEMPLATE_ATTACHMENTS_EMPTY') }}</p>
    </ng-template>
    <label *ngIf="editable" class="btn btn-sm btn-outline-secondary email-template-attachments-add" [class.disabled]="loading">
        {{ label('LBL_ADD_FILE') }}
        <input type="file" class="email-template-attachments-input" [disabled]="loading" (change)="add($event)">
    </label>
</section>
