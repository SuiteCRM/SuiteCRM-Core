<div class="acl-matrix">
    <p *ngIf="error" class="acl-matrix-message text-danger">{{ appString('LBL_ACTION_ERROR') }}</p>
    <p *ngIf="!structure && !error" class="acl-matrix-message">…</p>

    <ng-container *ngIf="structure">
        <input type="search" class="form-control form-control-sm acl-matrix-filter"
               [placeholder]="label('LBL_ACCESS_MATRIX_FILTER')" [attr.aria-label]="label('LBL_ACCESS_MATRIX_FILTER')"
               [(ngModel)]="filter" [ngModelOptions]="{standalone: true}">

        <div class="acl-matrix-scroll">
            <table class="acl-matrix-table" [class.acl-matrix-editing]="editing">
                <thead>
                <tr>
                    <td class="acl-matrix-module"></td>
                    <th *ngFor="let action of structure.actions; trackBy: trackName" scope="col">{{ action.label }}</th>
                </tr>
                <tr *ngIf="editing" class="acl-matrix-all">
                    <th scope="row" class="acl-matrix-module">{{ label('LBL_ACCESS_MATRIX_ALL') }}</th>
                    <td *ngFor="let action of structure.actions; trackBy: trackName">
                        <select #allLevels class="form-control form-control-sm"
                                [attr.aria-label]="label('LBL_ACCESS_MATRIX_ALL') + ': ' + action.label"
                                (change)="setAll(action, allLevels)">
                            <option value=""></option>
                            <option *ngFor="let option of action.options; trackBy: trackValue" [value]="option.value">{{ option.label }}</option>
                        </select>
                    </td>
                </tr>
                </thead>
                <tbody>
                <tr *ngFor="let module of rows(); trackBy: trackName">
                    <th scope="row" class="acl-matrix-module">{{ module.label }}</th>
                    <td *ngFor="let action of structure.actions; trackBy: trackName"
                        [class.acl-matrix-greyed]="isDisabled(module, action.name)">
                        <ng-container *ngIf="hasAction(module, action.name); else notAvailable">
                            <select *ngIf="editing; else levelView" class="form-control form-control-sm"
                                    [ngClass]="levelClass(module.name, action.name)"
                                    [attr.aria-label]="module.label + ': ' + action.label"
                                    [ngModel]="level(module.name, action.name)"
                                    (ngModelChange)="set(module.name, action.name, $event)"
                                    [ngModelOptions]="{standalone: true}">
                                <option *ngFor="let option of action.options; trackBy: trackValue" [ngValue]="option.value">{{ option.label }}</option>
                            </select>
                            <ng-template #levelView>
                                <span [ngClass]="levelClass(module.name, action.name)">{{ levelLabel(module.name, action.name) }}</span>
                            </ng-template>
                        </ng-container>
                        <ng-template #notAvailable><span class="acl-matrix-na">{{ label('LBL_ACCESS_MATRIX_NA') }}</span></ng-template>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </ng-container>
</div>
