<ng-container *ngIf="!editing; else edit">{{ readable() }}</ng-container>

<ng-template #edit>
    <div class="cron-schedule">
        <div *ngIf="!advanced" class="cron-schedule-basic">
            <select class="form-control form-control-sm cron-schedule-type" [attr.aria-label]="field?.label"
                    [(ngModel)]="type" (ngModelChange)="update()" [ngModelOptions]="{standalone: true}">
                <option *ngFor="let item of types" [ngValue]="item">{{ typeLabel(item) }}</option>
            </select>

            <div *ngIf="type === 'weekly'" class="cron-schedule-picks" role="group" [attr.aria-label]="appString('LBL_CRON_DOW')">
                <span class="cron-schedule-word">{{ appString('LBL_CRON_ON_THE_WEEKDAY') }}</span>
                <button *ngFor="let weekday of weekdays" type="button" class="btn btn-sm cron-schedule-pick"
                        [class.is-selected]="selectedWeekdays.includes('' + weekday)"
                        [attr.aria-pressed]="selectedWeekdays.includes('' + weekday)"
                        (click)="toggle(selectedWeekdays, '' + weekday)">{{ weekdayLabel(weekday) }}</button>
            </div>

            <div *ngIf="type === 'monthly'" class="cron-schedule-picks" role="group" [attr.aria-label]="appString('LBL_CRON_DAY')">
                <span class="cron-schedule-word">{{ appString('LBL_CRON_ON_THE_MONTHDAY') }}</span>
                <button *ngFor="let day of days" type="button" class="btn btn-sm cron-schedule-pick cron-schedule-day"
                        [class.is-selected]="selectedDays.includes(day)" [attr.aria-pressed]="selectedDays.includes(day)"
                        (click)="toggle(selectedDays, day)">{{ day }}</button>
            </div>

            <div class="cron-schedule-time">
                <span class="cron-schedule-word">{{ appString('LBL_CRON_AT') }}</span>
                <select class="form-control form-control-sm" [attr.aria-label]="appString('LBL_CRON_HOUR')"
                        [(ngModel)]="hour" (ngModelChange)="update()" [ngModelOptions]="{standalone: true}">
                    <option value=""></option>
                    <option *ngFor="let item of hours" [value]="item">{{ item }}</option>
                </select>
                <span>:</span>
                <select class="form-control form-control-sm" [attr.aria-label]="appString('LBL_CRON_MIN')"
                        [(ngModel)]="minute" (ngModelChange)="update()" [ngModelOptions]="{standalone: true}">
                    <option value=""></option>
                    <option *ngFor="let item of minutes" [value]="item">{{ item }}</option>
                </select>
            </div>
        </div>

        <div *ngIf="advanced" class="cron-schedule-raw">
            <label *ngFor="let part of rawParts; let index = index">
                <span>{{ appString(part) }}</span>
                <input type="text" class="form-control form-control-sm" [(ngModel)]="raw[index]" (ngModelChange)="update()"
                       [ngModelOptions]="{standalone: true}">
            </label>
        </div>

        <label class="cron-schedule-advanced">
            <input type="checkbox" [ngModel]="advanced" (ngModelChange)="setAdvanced($event)" [ngModelOptions]="{standalone: true}">
            {{ appString('LBL_CRON_RAW') }}
        </label>
    </div>
</ng-template>
