<div class="event-invitees">
    <p *ngIf="!invitees.length" class="empty">{{ label('LBL_EVENT_INVITEES_EMPTY') }}</p>
    <ul *ngIf="invitees.length" class="invitee-list">
        <li *ngFor="let invitee of invitees" class="invitee">
            <span class="invitee-module">{{ moduleLabel(invitee.module) }}</span>
            <a class="invitee-name" [routerLink]="route(invitee)">{{ invitee.name }}</a>
            <span *ngIf="invitee.email" class="invitee-email">{{ invitee.email }}</span>
            <span class="invitee-status" [class]="'invitee-status status-' + (invitee.accept_status || 'none')">
                {{ acceptStatus(invitee.accept_status) }}
            </span>
        </li>
    </ul>
</div>
