<div class="event-invitees edit">
    <ul *ngIf="invitees.length" class="invitee-list">
        <li *ngFor="let invitee of invitees; trackBy: trackByKey" class="invitee">
            <span class="invitee-module">{{ moduleLabel(invitee.module) }}</span>
            <span class="invitee-name">{{ invitee.name }}</span>
            <span *ngIf="invitee.email" class="invitee-email">{{ invitee.email }}</span>
            <span class="invitee-status" [class]="'invitee-status status-' + (invitee.accept_status || 'none')">
                {{ acceptStatus(invitee.accept_status) }}
            </span>
            <button type="button" class="btn btn-sm btn-link remove-invitee" (click)="remove(invitee)"
                    [title]="label('LBL_REMOVE')">{{ label('LBL_REMOVE') }}</button>
        </li>
    </ul>
    <div class="invitee-search">
        <input class="form-control form-control-sm" type="text" autocomplete="off"
               [value]="query" [placeholder]="label('LBL_EVENT_INVITEES_SEARCH')"
               [attr.aria-label]="label('LBL_ADD_INVITEE')"
               (input)="search($any($event.target).value)"
               (blur)="closeResults()"
               (keydown.escape)="closeResults()">
        <ul *ngIf="open && query.trim()" class="invitee-results" role="listbox">
            <li *ngIf="searching && !results.length" class="muted">…</li>
            <li *ngIf="!searching && !results.length" class="muted">{{ label('LBL_EVENT_INVITEES_NO_RESULT') }}</li>
            <li *ngFor="let result of results" role="option" class="invitee-result"
                (mousedown)="$event.preventDefault(); add(result)">
                <span class="invitee-module">{{ moduleLabel(result.module) }}</span>
                <span class="invitee-name">{{ result.name }}</span>
                <span *ngIf="result.email" class="invitee-email">{{ result.email }}</span>
            </li>
        </ul>
    </div>
</div>
