<div class="event-reminders">
    <p *ngIf="!reminders.length" class="empty">{{ label('LBL_EVENT_REMINDERS_EMPTY') }}</p>
    <ul *ngIf="reminders.length" class="reminder-list">
        <li *ngFor="let reminder of reminders" class="reminder">
            <span *ngIf="reminder.popup" class="reminder-action">
                {{ label('LBL_REMINDERS_POPUP') }}: {{ timer(reminder.timer_popup) }}
            </span>
            <span *ngIf="reminder.email" class="reminder-action">
                {{ label('LBL_REMINDERS_EMAIL') }}: {{ timer(reminder.timer_email) }}
            </span>
            <span *ngIf="inviteeNames(reminder)" class="reminder-invitees">{{ inviteeNames(reminder) }}</span>
        </li>
    </ul>
</div>
