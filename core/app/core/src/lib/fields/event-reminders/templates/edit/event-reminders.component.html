<div class="event-reminders edit">
    <div *ngFor="let reminder of reminders; trackBy: trackByIndex" class="reminder-edit">
        <div class="reminder-actions">
            <label class="reminder-action">
                <input type="checkbox" [checked]="reminder.popup" (change)="setAction(reminder, 'popup', $any($event.target).checked)">
                {{ label('LBL_REMINDERS_POPUP') }}
            </label>
            <select class="custom-select custom-select-sm" [disabled]="!reminder.popup" [attr.aria-label]="label('LBL_REMINDERS_POPUP')"
                    (change)="setTimer(reminder, 'timer_popup', $any($event.target).value)">
                <option *ngFor="let option of timerOptions" [value]="option.value"
                        [selected]="option.value === reminder.timer_popup">{{ option.label }}</option>
            </select>
            <label class="reminder-action">
                <input type="checkbox" [checked]="reminder.email" (change)="setAction(reminder, 'email', $any($event.target).checked)">
                {{ label('LBL_REMINDERS_EMAIL') }}
            </label>
            <select class="custom-select custom-select-sm" [disabled]="!reminder.email" [attr.aria-label]="label('LBL_REMINDERS_EMAIL')"
                    (change)="setTimer(reminder, 'timer_email', $any($event.target).value)">
                <option *ngFor="let option of timerOptions" [value]="option.value"
                        [selected]="option.value === reminder.timer_email">{{ option.label }}</option>
            </select>
            <button type="button" class="btn btn-sm btn-link remove-reminder" (click)="removeReminder(reminder)">
                {{ label('LBL_REMINDERS_REMOVE_REMINDER') }}
            </button>
        </div>
        <div class="reminder-invitees">
            <span *ngFor="let invitee of reminder.invitees" class="reminder-invitee">
                {{ invitee.value }}
                <button type="button" class="btn btn-sm btn-link remove-invitee" (click)="removeInvitee(reminder, invitee)"
                        [attr.aria-label]="label('LBL_REMOVE')" [title]="label('LBL_REMOVE')">×</button>
            </span>
            <button type="button" class="btn btn-sm btn-outline-main" (click)="addAllInvitees(reminder)">
                {{ label('LBL_REMINDERS_ADD_ALL_INVITEES') }}
            </button>
        </div>
    </div>
    <button type="button" class="btn btn-sm btn-outline-main" (click)="addReminder()">{{ label('LBL_REMINDERS_ADD_REMINDER') }}</button>
</div>
