<div class="activity-streams-settings">
    <h2 class="activity-streams-settings-title">{{ label('LBL_MODULE_NAME') }}</h2>

    <p *ngIf="loading && !data" class="activity-streams-settings-muted">…</p>

    <form *ngIf="data" class="activity-streams-settings-form">
        <fieldset class="activity-streams-settings-panel">
            <div class="activity-streams-settings-option">
                <input type="checkbox" id="activity-streams-enable" name="enabled" [ngModel]="enabled"
                       (ngModelChange)="toggleFeed($event)">
                <label for="activity-streams-enable">{{ label('LBL_ENABLE_FEED') }}</label>
            </div>
        </fieldset>

        <fieldset class="activity-streams-settings-panel">
            <legend>{{ label('LBL_ENABLE_MODULE_LIST') }}</legend>
            <div class="activity-streams-settings-modules">
                <div *ngFor="let module of data.modules; trackBy: trackModule" class="activity-streams-settings-option">
                    <input type="checkbox" [id]="'activity-streams-' + module.module" [name]="'module-' + module.module"
                           [disabled]="!enabled" [(ngModel)]="modules[module.module]">
                    <label [for]="'activity-streams-' + module.module">{{ module.label }}</label>
                </div>
            </div>
            <div class="activity-streams-settings-option activity-streams-settings-user">
                <input type="checkbox" id="activity-streams-user" name="userFeed" [disabled]="!enabled" [(ngModel)]="userFeed">
                <label for="activity-streams-user">{{ label('LBL_ENABLE_USER_FEED') }}</label>
            </div>
        </fieldset>

        <div class="activity-streams-settings-buttons">
            <button type="button" class="btn btn-sm btn-main" [disabled]="loading" (click)="save()">{{ label('LBL_SAVE_BUTTON_LABEL') }}</button>
            <a class="btn btn-sm btn-outline-secondary" [routerLink]="['/administration']">{{ label('LBL_CANCEL_BUTTON_LABEL') }}</a>
            <button type="button" class="btn btn-sm btn-outline-danger" [disabled]="loading" (click)="deleteEntries()">{{ label('LBL_FLUSH_RECORDS') }}</button>
        </div>
    </form>
</div>
