<div class="dropdown-editor">
    <h2 class="dropdown-editor-title">{{ label('LBL_DROPDOWNEDITOR') }}</h2>

    <p *ngIf="loading && !data" class="dropdown-editor-muted">…</p>

    <ng-container *ngIf="data">
        <div class="dropdown-editor-toolbar">
            <button type="button" class="btn btn-sm btn-main" [disabled]="loading" (click)="open('')">+ {{ label('LBL_BTN_ADDDROPDOWN') }}</button>
            <input type="search" class="form-control form-control-sm dropdown-editor-search" [placeholder]="label('LBL_SEARCH')"
                   [attr.aria-label]="label('LBL_SEARCH')" [(ngModel)]="search">
            <span class="dropdown-editor-count">{{ shown().length }}</span>
        </div>

        <p *ngIf="!shown().length" class="dropdown-editor-muted">{{ label('LBL_DROPDOWN_EDITOR_NO_MATCH') }}</p>

        <div class="dropdown-editor-grid">
            <div *ngFor="let name of shown(); trackBy: trackName" class="dropdown-editor-card"
                 role="button" tabindex="0" [title]="name" (click)="open(name)" (keydown.enter)="open(name)">
                <span class="dropdown-editor-mono">{{ name }}</span>
            </div>
        </div>
    </ng-container>
</div>
