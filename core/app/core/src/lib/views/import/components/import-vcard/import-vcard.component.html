<div class="import-wizard" [attr.aria-busy]="loading">
    <div class="import-wizard-head">
        <h2 class="import-wizard-title">
            {{ label('LBL_IMPORT_VCARD_BUTTON_LABEL') }}
            <span *ngIf="moduleName" class="import-wizard-module">{{ moduleName }}</span>
        </h2>
    </div>

    <section class="import-wizard-step">
        <p><strong>{{ label('LBL_IMPORT_VCARDTEXT') }}</strong></p>
        <div class="import-wizard-field">
            <label class="import-wizard-label" for="import-wizard-vcard">{{ label('LBL_IMPORT_VCARD') }}</label>
            <input id="import-wizard-vcard" type="file" class="form-control-file" accept=".vcf,.vcard,text/vcard,text/x-vcard"
                   (change)="fileChosen($event)">
        </div>
        <p *ngIf="error" class="import-wizard-notice import-wizard-errors" role="alert">{{ error }}</p>
        <div class="import-wizard-buttons">
            <button type="button" class="btn btn-sm btn-main" [disabled]="loading" (click)="importVCard()">{{ label('LBL_IMPORT_VCARD_BUTTON_LABEL') }}</button>
            <button type="button" class="btn btn-sm btn-outline-secondary" (click)="cancel()">{{ label('LBL_CANCEL_BUTTON_LABEL') }}</button>
        </div>
    </section>
</div>
