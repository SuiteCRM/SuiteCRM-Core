<div class="pdf-settings">
    <h2 class="pdf-settings-title">{{ label('LBL_PDF_HEADER') }}</h2>
    <p class="pdf-settings-intro">{{ label('LBL_PDF_HEADER_DESC') }}</p>

    <p *ngIf="error" class="pdf-settings-error" role="alert">{{ label('LBL_AJAX_SUBMIT_FAIL') }}</p>
    <p *ngIf="loading && !data" class="pdf-settings-muted">…</p>

    <form *ngIf="data" class="pdf-settings-form" (ngSubmit)="save()">
        <fieldset class="pdf-settings-panel">
            <legend>{{ label('LBL_PDF_INTERFACE') }}</legend>
            <div class="pdf-settings-row">
                <div>
                    <label for="pdf-settings-engine">{{ label('LBL_PDF_OPTIONS') }}</label>
                    <small id="pdf-settings-engine-help" class="form-text text-muted">{{ label('LBL_PDF_OPTIONS_HELP') }}</small>
                </div>
                <select id="pdf-settings-engine" name="engine" class="form-control form-control-sm" aria-describedby="pdf-settings-engine-help"
                        [(ngModel)]="engine">
                    <option *ngFor="let item of data.engines" [value]="item.value">{{ item.label }}</option>
                </select>
            </div>
        </fieldset>

        <div class="pdf-settings-buttons">
            <button type="submit" class="btn btn-sm btn-main" [disabled]="loading">{{ label('LBL_SAVE_BUTTON_LABEL') }}</button>
            <a class="btn btn-sm btn-outline-secondary" [routerLink]="['/administration']">{{ label('LBL_CANCEL_BUTTON_LABEL') }}</a>
        </div>
    </form>
</div>
