<div class="studio-export">
    <div class="studio-toolbar">
        <button type="button" class="btn btn-sm btn-main" [disabled]="loading || !validName || !selected.length" (click)="export()">{{ label('LBL_EC_EXPORTBTN') }}</button>
    </div>

    <div class="studio-form">
        <label for="studio-export-name"><span class="studio-required" aria-hidden="true">*</span> {{ label('LBL_EC_NAME') }}</label>
        <input id="studio-export-name" type="text" class="form-control form-control-sm" maxlength="50" required
               [attr.aria-invalid]="name.trim() !== '' && !validName" [(ngModel)]="name">
        <label for="studio-export-author">{{ label('LBL_EC_AUTHOR') }}</label>
        <input id="studio-export-author" type="text" class="form-control form-control-sm" maxlength="255" [(ngModel)]="author">
        <label for="studio-export-description">{{ label('LBL_EC_DESCRIPTION') }}</label>
        <textarea id="studio-export-description" class="form-control form-control-sm" rows="3" [(ngModel)]="description"></textarea>
    </div>

    <p *ngIf="!modules" class="studio-muted">…</p>

    <div *ngIf="modules" class="studio-scroll">
        <table class="studio-data-table studio-table">
            <tbody>
            <tr *ngFor="let item of modules; trackBy: trackModule">
                <td class="studio-export-module">
                    <label *ngIf="item.exportable; else plain" class="studio-check">
                        <input type="checkbox" [(ngModel)]="checked[item.module]" [disabled]="loading">
                        {{ item.name || item.module }}
                    </label>
                    <ng-template #plain>{{ item.name || item.module }}</ng-template>
                </td>
                <td>
                    <span *ngFor="let text of item.items; let last = last">{{ text }}<br *ngIf="!last"></span>
                </td>
            </tr>
            </tbody>
        </table>
        <p *ngIf="modules.length && !selected.length" class="studio-muted">{{ label('LBL_EC_CHECKERROR') }}</p>
    </div>
</div>
