<div class="studio-fields">
    <div class="studio-toolbar">
        <button type="button" class="btn btn-sm btn-main" (click)="edit('')">{{ label('LBL_BTN_ADDFIELD') }}</button>
        <button type="button" class="btn btn-sm btn-outline-secondary" (click)="editLabels()">{{ label('LBL_BTN_EDLABELS') }}</button>
        <input type="search" class="form-control form-control-sm studio-search" [placeholder]="label('LBL_SEARCH')"
               [attr.aria-label]="label('LBL_SEARCH')" [(ngModel)]="search">
    </div>

    <p *ngIf="loading" class="studio-muted">…</p>

    <div class="studio-fields-layout" [class.is-editing]="edited !== null">
    <div *ngIf="fields" class="studio-scroll">
        <table class="studio-data-table studio-table">
            <thead>
            <tr>
                <th *ngFor="let column of columns" scope="col" [attr.aria-sort]="sortState(column.key)">
                    <button type="button" class="btn btn-link studio-sort" (click)="sortBy(column.key)">
                        {{ label(column.label) }}
                        <span *ngIf="sort === column.key" aria-hidden="true">{{ descending ? '▾' : '▴' }}</span>
                    </button>
                </th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let field of shown; trackBy: trackName" [class.is-changed]="edited === field.name">
                <td>
                    <a href="javascript:void(0)" class="studio-mono" (click)="edit(field.name)">{{ field.name }}</a>
                    <span *ngIf="field.custom" class="studio-pill studio-custom">{{ label('LBL_HCUSTOM') }}</span>
                </td>
                <td>{{ field.label }}</td>
                <td>{{ field.type }}</td>
            </tr>
            </tbody>
        </table>
        <p *ngIf="!shown.length" class="studio-muted">{{ label('LBL_NONE') }}</p>
    </div>

    <scrm-studio-field-editor *ngIf="edited !== null" [module]="module" [package]="package" [field]="edited" [labels]="labels"
                             (closed)="closeEditor($event)"></scrm-studio-field-editor>
    </div>
</div>
