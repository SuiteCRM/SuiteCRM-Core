<div class="studio-labels">
    <div class="studio-toolbar">
        <button type="button" class="btn btn-sm btn-main" [disabled]="loading || !changed" (click)="save()">{{ label('LBL_BTN_SAVEPUBLISH') }}</button>
        <a class="btn btn-sm btn-outline-secondary" href="#/studio/wizard?wizard=StudioWizard&option=RenameTabs">{{ label('LBL_BTN_RENAME_MODULE') }}</a>
        <ng-container *ngIf="data">
            <label class="studio-inline" for="studio-labels-language">{{ label('LBL_LANGUAGE') }}</label>
            <select id="studio-labels-language" class="form-control form-control-sm studio-select" [disabled]="loading"
                    [(ngModel)]="language" (ngModelChange)="load()">
                <option *ngFor="let option of data.languages" [value]="option.value">{{ option.label }}</option>
            </select>
            <select class="form-control form-control-sm studio-select" [attr.aria-label]="label('LBL_LABELS')" [disabled]="loading"
                    [(ngModel)]="type" (ngModelChange)="load()">
                <option *ngFor="let option of data.types" [value]="option.value">{{ option.label }}</option>
            </select>
        </ng-container>
        <input type="search" class="form-control form-control-sm studio-search" [placeholder]="label('LBL_SEARCH')"
               [attr.aria-label]="label('LBL_SEARCH')" [(ngModel)]="search">
    </div>

    <div *ngIf="data" class="studio-scroll">
        <table class="studio-data-table studio-table">
            <tbody>
            <tr *ngFor="let item of shown; trackBy: trackKey" [class.is-changed]="changes[item.key] !== undefined">
                <th scope="row"><label class="studio-mono" [for]="'studio-label-' + item.key">{{ item.key }}</label></th>
                <td>
                    <input type="text" class="form-control form-control-sm" [id]="'studio-label-' + item.key"
                           [ngModel]="value(item)" (ngModelChange)="change(item, $event)">
                </td>
            </tr>
            </tbody>
        </table>
        <p *ngIf="!shown.length" class="studio-muted">{{ label('LBL_NONE') }}</p>
    </div>
</div>
